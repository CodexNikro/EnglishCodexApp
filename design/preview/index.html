<div class="reviewbar"><div class="review-caption"><strong>RECALL · ДИЗАЙН-ПРОТОТИП</strong><br>Пример данных. ИИ и микрофон не подключены.</div><div class="themes" role="group" aria-label="Дизайн-направление"><button data-theme-button="paper" aria-pressed="true">01 Paper</button><button data-theme-button="signal" aria-pressed="false">02 Signal</button><button data-theme-button="fieldnotes" aria-pressed="false">03 Fieldnotes</button></div></div>
<aside class="sidebar"><div class="brand"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M7 26V10h8c7 0 10 4 10 8s-3 8-10 8H7Z" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M18 26 28 7M22 26h7" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>Recall</div><nav class="nav" aria-label="Основная навигация" id="navigation"></nav><div class="side-note"><div class="eyebrow">Маленький шаг каждый день</div><p>Вспомнить.<br>Произнести.<br>Сделать своим.</p></div><div class="profile"><span class="avatar">Н</span><div><strong>Никита</strong><small>Английский · A2 → B1</small></div></div></aside>
<main class="main" id="main-content"><div class="topline"><span id="breadcrumb">Моё обучение / Сегодня</span><div class="topright"><span>27 октября, вторник</span><span class="pill"><span class="dot"></span>В своём темпе</span></div></div><div id="screen"></div></main>
<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
<script>
const paths={home:'M3 10 10 4l7 6v8H5v-8M8 18v-5h4v5',cards:'M5 3h11v14H5zM2 6v14h11',voice:'M10 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3ZM4 10v1a6 6 0 0 0 12 0v-1M10 17v4M7 21h6',progress:'M3 17V5M3 17h15M6 13l4-4 3 2 4-6',book:'M3 4h5a4 4 0 0 1 3 1v13a4 4 0 0 0-3-1H3V4Zm15 0h-4a4 4 0 0 0-3 1v13a4 4 0 0 1 3-1h4V4Z',arrow:'M4 10h13M12 5l5 5-5 5',back:'M17 10H4M9 5l-5 5 5 5',clock:'M10 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16ZM10 6v5l3 2',check:'m4 10 4 4 9-9',search:'M9 15a6 6 0 1 0 0-12 6 6 0 0 0 0 12ZM14 14l5 5',plus:'M10 4v12M4 10h12',pause:'M7 4v13M13 4v13',help:'M7 7a3 3 0 1 1 5 2c-2 1-2 1-2 3M10 16v.1',flag:'M5 19V3M5 3h12l-3 4 3 4H5',sound:'m4 8 4-3v12l-4-3H1V8h3ZM12 7c2 2 2 6 0 8M15 4c4 4 4 10 0 14',globe:'M10 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16ZM2 10h16M10 2c-5 5-5 12 0 17M10 2c5 5 5 12 0 17'};
function icon(name,cls=''){return `<svg class="icon ${cls}" viewBox="0 0 22 24" aria-hidden="true"><path d="${paths[name]||paths.arrow}"/></svg>`}
const screens=[['today','Сегодня','home'],['recall','Вспомнить','cards'],['voice','Разговор','voice'],['progress','Прогресс','progress'],['dictionary','Словарь','book']];
let active='today',theme='paper',cardIndex=0,revealed=false,hinted=false,typed=false,voiceActive=false,voiceFeedback=false,selectedWord=0,topic='all',query='';
const dictionaryExposures=new Set();
const cards=[{context:'Повседневная жизнь',prompt:'Попросите у друга зарядку на время.',instruction:'Как скажете это по-английски?',word:'borrow',ipa:'/ˈbɑːroʊ/',translation:'брать взаймы; брать на время',example:'Can I borrow your charger?',hint:'Вы хотите взять чужую вещь и потом вернуть её.'},{context:'Помощь другу',prompt:'Предложите дать другу свою книгу на неделю.',instruction:'Начните с «Я могу…»',word:'lend',ipa:'/lend/',translation:'давать взаймы; одалживать кому-либо',example:'I can lend you my book for a week.',hint:'В этой ситуации вы отдаёте свою вещь на время.'},{context:'Путешествия',prompt:'Скажите, что хотите забронировать номер на две ночи.',instruction:'Представьте, что звоните в отель.',word:'book',ipa:'/bʊk/',translation:'бронировать',example:'I would like to book a room for two nights.',hint:'Вам нужно заранее закрепить за собой номер.'},{context:'Образование',prompt:'Скажите, что читаете книгу о путешествиях.',instruction:'Расскажите об этом знакомому.',word:'book',ipa:'/bʊk/',translation:'книга',example:'I am reading a book about travel.',hint:'Здесь речь о предмете для чтения, а не о бронировании.'}];
const words=[{en:'borrow',ipa:'/ˈbɑːroʊ/',ru:'брать взаймы; одалживать у кого-либо',topic:'money',label:'Деньги',example:'Can I borrow your charger?',source:'S002 · текст · S049 · фотография',stage:'С подсказкой',level:1},{en:'lend',ipa:'/lend/',ru:'давать взаймы; одалживать кому-либо',topic:'money',label:'Деньги',example:'I can lend you my book.',source:'S002 · текст · S049 · фотография',stage:'Вспоминаю',level:2},{en:'book',ipa:'/bʊk/',ru:'бронировать',topic:'travel',label:'Путешествия',example:'I would like to book a room.',source:'S003 · текст',stage:'Вспоминаю',level:2},{en:'book',ipa:'/bʊk/',ru:'книга',topic:'education',label:'Образование',example:'I am reading a book about travel.',source:'S009 · текст',stage:'В новой фразе',level:3}];
function nav(){document.getElementById('navigation').innerHTML=screens.map(([key,title,i])=>`<button data-nav="${key}" class="${active===key?'active':''}" ${active===key?'aria-current="page"':''}>${icon(i)}<span>${title}</span>${key==='recall'?'<span class="navbadge">12</span>':''}</button>`).join('');document.getElementById('breadcrumb').textContent='Моё обучение / '+screens.find(x=>x[0]===active)[1]}
function head(kicker,title,sub,extra=''){return `<header class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${sub}</p></div>${extra}</header>`}
function today(){return head('Хороший день, чтобы вспомнить','Слова становятся<br>вашими.','Немного практики сейчас. Больше свободы в следующем разговоре.')+`<div class="split"><div><section class="panel session"><div class="session-top"><span class="eyebrow">Ваш план на сегодня</span><span class="pill">${icon('clock')} 15 минут</span></div><h2 class="session-title">Начните с того,<br>что уже знаете.</h2><p>Достаньте знакомые слова из памяти, затем попробуйте их в разговоре.</p><svg class="session-ornament" viewBox="0 0 100 100" fill="none" aria-hidden="true"><path d="M18 15h49v66H18zM35 26h49v65H35zM46 44h25M46 53h20M46 62h25" stroke="currentColor" stroke-width="2"/></svg><div class="mini-metrics"><div><strong>12</strong><span>повторений</span></div><div><strong>4</strong><span>новых слова</span></div><div><strong>3 мин</strong><span>разговор</span></div></div><div class="session-footer"><button class="btn primary" data-nav="recall">Начать практику ${icon('arrow')}</button><span class="microcopy">Можно закончить в любой момент</span></div></section><div class="section-title"><h2>От памяти — к разговору</h2><small>Три небольших шага</small></div><div class="routine"><div class="routine-row"><span class="step-index">01</span><div class="routine-text"><h3>Вспомнить без подсказки</h3><p>Слова из предыдущих занятий</p></div><span class="duration">7 минут</span>${icon('arrow')}</div><div class="routine-row"><span class="step-index">02</span><div class="routine-text"><h3>Добавить несколько новых</h3><p>Значение, звучание и живая фраза</p></div><span class="duration">5 минут</span>${icon('arrow')}</div><div class="routine-row"><span class="step-index">03</span><div class="routine-text"><h3>Сказать по-своему</h3><p>Короткая ситуация с ИИ</p></div><span class="duration">3 минуты</span>${icon('arrow')}</div></div></div><aside><div class="retention"><div class="eyebrow">Последняя проверка через 7 дней</div><div class="number">7<span> / 10</span></div><p>слов вы назвали самостоятельно.<br>Без подсказки и предварительного повторения.</p><svg class="chart" viewBox="0 0 300 90" fill="none" aria-label="Результаты пяти проверок: 5, 4, 6, 5 и 7 из 10"><path d="M4 76H296M4 40H296" stroke="var(--line)"/><path d="m6 58 71 10 71-25 71 13 71-36" stroke="currentColor" stroke-width="2.5"/><circle cx="290" cy="20" r="4" fill="currentColor"/></svg><div class="chart-labels"><span>5 проверок · по 10 слов</span><span>Сегодня</span></div><button class="btn ghost small" data-nav="progress">Посмотреть подробнее ${icon('arrow')}</button></div><div class="aside-note"><p>Знакомое слово —<br>ещё не всегда<br>доступное в речи.</p><small>Сегодня потренируем именно<br>самостоятельное вспоминание.</small></div></aside></div>`}
function recall(){const c=cards[cardIndex];return `<button class="back-link" data-nav="today">${icon('back')} К плану на сегодня</button><div class="recall-wrap"><div class="recall-progress"><span>Вспомнить · ${String(cardIndex+1).padStart(2,'0')} / ${String(cards.length).padStart(2,'0')}</span><div class="progress-track">${cards.map((_,i)=>`<span class="${i<=cardIndex?'on':''}"></span>`).join('')}</div><span>Без спешки</span></div><section class="panel recall-card"><span class="context-tag">${icon('globe')} ${c.context}</span><h1>${c.prompt}</h1><p class="recall-instruction">${c.instruction}<br>Сначала произнесите ответ вслух.</p>${dictionaryExposures.has(cardIndex)?'<p class="feedback-note">Практика после просмотра слова. Независимую проверку проведём позже.</p>':''}${hinted?`<div class="hint">Подсказка: ${c.hint}</div>`:''}${typed&&!revealed?'<div class="typing"><label class="sr-only" for="typedAnswer">Ваш ответ по-английски</label><input class="input" id="typedAnswer" placeholder="Ваш вариант…" autocomplete="off"></div>':''}${!revealed?`<div class="recall-actions"><button class="btn primary" data-action="reveal">Показать ответ ${icon('arrow')}</button><button class="btn secondary" data-action="type">${icon('cards')} ${typed?'Ответьте в поле выше':'Ответить текстом'}</button></div><button class="btn ghost small" data-action="hint">Мне нужна подсказка</button><p class="microcopy">Откройте ответ после своей попытки вспомнить.</p>`:`<div class="answer"><div><strong>${c.word}</strong><span class="ipa">${c.ipa}</span></div><p>${c.translation}</p><p class="example" lang="en">${c.example}</p><p class="muted">Это один из вариантов. Другая подходящая фраза тоже может быть правильной.</p></div><div class="grade-row"><button data-grade="again">Не вспомнил</button><button data-grade="hint">С подсказкой</button><button data-grade="self">Самостоятельно</button></div>`}</section><p class="recall-footnote">Узнать ответ после открытия — нормально.<br>Отметьте это честно: так следующий повтор будет полезнее.</p></div>`}
function wave(){return `<div class="wave-orbit"><div class="waveform ${voiceActive?'active':''}" aria-hidden="true">${[14,24,39,49,31,42,23,16].map((h,i)=>`<span style="--h:${h}px;--i:${i}"></span>`).join('')}</div></div>`}
function voice(){return head('Разговорная практика','Скажите по-своему.','Короткая ситуация. Знакомые слова. Никакой гонки за идеальным ответом.')+`<div class="voice-grid"><section class="panel voice-studio"><div class="studio-top"><span class="status"><span class="dot"></span>ИИ-собеседник · пример</span><span>Ситуация 01 / 03</span></div>${wave()}<h2 lang="en">${voiceActive?'Take your time.<br>I’m listening.':'You’re planning a weekend away.<br>Where would you like to stay?'}</h2><p class="turn-label">${voiceActive?'Демонстрация состояния «слушаю»':'Ваш ход. Расскажите, что вы хотите сделать.'}</p><div class="voice-controls"><button class="btn secondary small" data-action="translate">Перевод</button><button class="mic" data-action="mic" aria-label="${voiceActive?'Завершить демонстрацию ответа':'Показать состояние записи (микрофон не включается)'}">${icon(voiceActive?'pause':'voice')}</button><button class="btn secondary small" data-action="feedback">Завершить</button></div><p class="privacy">Дизайн-макет: звук не записывается и никуда не отправляется.</p></section><aside><section class="panel scenario"><span class="eyebrow">Ваша ситуация</span><h3>Выходные<br>в новом городе</h3><p>Вы договариваетесь о поездке с другом. Отвечайте так, как сказали бы в жизни.</p><div class="mission">${icon('flag')}<span>Расскажите, где хотите остановиться.</span></div><div class="mission">${icon('flag')}<span>Попросите нужную вещь на время.</span></div><div class="mission">${icon('flag')}<span>Предложите свою помощь.</span></div></section><div class="scaffold"><button class="btn ghost small" data-action="scaffold">${icon('help')} Не знаю, с чего начать</button><p class="microcopy">Подсказки — по запросу.<br>Разбор — после разговора.</p></div></aside></div>${voiceFeedback?`<section class="panel conversation-result"><div class="eyebrow">Пример разбора · не оценка вашей речи</div><h3 style="margin-top:12px">Мысль понятна. Теперь — чуть естественнее.</h3><p lang="en">“I want book a room.” → <strong>“I want to book a room.”</strong></p><p class="muted" style="margin-top:10px">После want перед глаголом нужен to. Попробуйте сказать эту мысль ещё раз в новой ситуации.</p><button class="btn primary small" data-action="retry" style="margin-top:17px">Повторить ситуацию ${icon('arrow')}</button></section>`:''}`}
function progress(){return head('Прогресс, который ощущается в речи','Что остаётся<br>с вами.','Узнавание, самостоятельное вспоминание и применение — три отдельных результата.')+`<section class="metric-band"><div><span class="eyebrow">Вспомнили через 7 дней</span><strong class="accent">7<span> / 10</span></strong><p>Самостоятельно, до повторения.<br>Проверка 27 октября.</p></div><div><span class="eyebrow">Узнали после предъявления</span><strong>9<span> / 10</span></strong><p>Другая проверка.<br>Это ещё не свободная речь.</p></div><div><span class="eyebrow">Применили в новой ситуации</span><strong>4<span> / 6</span></strong><p>Подходящая самостоятельная фраза.<br>Шесть слов в проверке.</p></div></section><div class="progress-layout"><section class="panel line-chart"><h3>Самостоятельное вспоминание</h3><p class="microcopy" style="margin-top:6px">Пять отдельных проверок по 10 слов</p><svg viewBox="0 0 500 180" fill="none" role="img" aria-label="Результаты проверок: 5, 4, 6, 5, 7 слов из 10"><path d="M28 18H486M28 94H486M28 170H486" stroke="var(--line)" stroke-dasharray="3 4"/><g fill="var(--muted)" font-size="10" font-family="Arial"><text x="0" y="22">10</text><text x="7" y="98">5</text><text x="7" y="175">0</text></g><path d="m35 94 110 15 110-30 110 15 110-30" stroke="currentColor" stroke-width="3"/><g fill="var(--surface)" stroke="currentColor" stroke-width="2"><circle cx="35" cy="94" r="4"/><circle cx="145" cy="109" r="4"/><circle cx="255" cy="79" r="4"/><circle cx="365" cy="94" r="4"/></g><circle cx="475" cy="64" r="6" fill="currentColor"/></svg><div class="chart-foot"><span>29 сентября</span><span>27 октября</span></div></section><aside class="measurement-note"><h3>Семь слов доступны.<br>Три ещё укрепляем.</h3><p>Последняя выборка небольшая. Смотрите на несколько проверок и на то, что удаётся сказать в разговоре.</p><div class="evidence-row"><span>Самостоятельно</span><strong>7 слов</strong></div><div class="evidence-row"><span>После подсказки</span><strong>2 слова</strong></div><div class="evidence-row"><span>Пока не вспомнили</span><strong>1 слово</strong></div><button class="btn primary small" data-nav="recall" style="margin-top:20px">Вернуться к практике ${icon('arrow')}</button></aside></div><p class="section-divider">Повторения и время в приложении помогают организовать занятия. Основной результат — доступные вам слова спустя время.</p>`}
function dictDetail(){const w=words[selectedWord];return `<aside class="panel word-detail"><span class="eyebrow">${w.label} · слово в контексте</span><h2 class="word-title" lang="en">${w.en}</h2><span class="ipa">${w.ipa} · en-US</span><p class="translation">${w.ru}</p><p class="example" lang="en">${w.example}</p><div class="stage-explain">${w.level===1?'Последний ответ — с подсказкой. Следующий раз попробуйте самостоятельно.':w.level===2?'Самостоятельно вспомнили в последней попытке. Вернёмся к слову позже.':'Использовали в новой фразе. Проверим сохранение спустя время.'}</div><button class="btn primary small" data-action="practiceWord">Попрактиковать ${icon('arrow')}</button><p class="source" style="margin-top:22px">Из ваших учебных материалов<br>${w.source}<br>Пример фразы добавлен для макета.</p></aside>`}
function wordList(){const matches=words.map((w,i)=>({...w,i})).filter(w=>(topic==='all'||w.topic===topic)&&(w.en+' '+w.ru).toLowerCase().includes(query.toLowerCase()));matches.forEach(w=>dictionaryExposures.add(w.i));return matches.length?matches.map(w=>`<button class="word-item ${w.i===selectedWord?'active':''}" data-word="${w.i}" aria-pressed="${w.i===selectedWord}"><div><div class="word-en" lang="en">${w.en}</div><div class="word-ru">${w.ru}</div><span class="word-topic">${w.label}</span></div><span class="word-stage">${[1,2,3].map(n=>`<span class="stage-dot ${n<=w.level?'filled':''}"></span>`).join('')}<span>${w.stage}</span></span></button>`).join(''):'<p class="empty">В демонстрационной выборке нет совпадений.</p>'}
function dictionary(){return head('Ваша лексика · ваши темы','Слова из вашей жизни.','1 627 записей из учебных материалов. Возвращайтесь к ним в своём темпе.',`<span class="pill head-count">23 темы</span>`)+`<div class="word-tools"><div class="search">${icon('search')}<label class="sr-only" for="wordSearch">Найти слово или перевод</label><input class="input" id="wordSearch" placeholder="Найти слово или перевод" value="${query.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}"></div><span class="microcopy">В макете показаны 4 записи</span></div><div class="topic-filter" role="group" aria-label="Фильтр по теме">${[['all','Все темы'],['money','Деньги'],['travel','Путешествия'],['education','Образование']].map(([key,label])=>`<button data-topic="${key}" class="${topic===key?'active':''}" aria-pressed="${topic===key}">${label}</button>`).join('')}</div><div class="dictionary-layout"><section><div class="word-list" id="wordList">${wordList()}</div><p class="section-divider">Одинаковое написание может иметь разные значения. «Book — бронировать» и «book — книга» хранятся отдельно.</p></section><div id="wordDetail">${dictDetail()}</div></div>`}
function render(){nav();document.getElementById('screen').innerHTML=({today,recall,voice,progress,dictionary}[active])()}
function go(key){active=key;render();window.scrollTo({top:0,behavior:'instant'})}
let toastTimer;function toast(text){clearTimeout(toastTimer);const el=document.getElementById('toast');el.textContent=text;el.classList.remove('hidden');toastTimer=setTimeout(()=>el.classList.add('hidden'),4500)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.themeButton){theme=b.dataset.themeButton;document.documentElement.dataset.theme=theme;document.querySelectorAll('[data-theme-button]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));return}if(b.dataset.nav){go(b.dataset.nav);return}if(b.dataset.topic){topic=b.dataset.topic;render();return}if(b.dataset.word!==undefined){selectedWord=Number(b.dataset.word);document.getElementById('wordList').innerHTML=wordList();document.getElementById('wordDetail').innerHTML=dictDetail();return}if(b.dataset.grade){const wasHinted=hinted||b.dataset.grade==='hint';const note=dictionaryExposures.has(cardIndex)?'Практика после просмотра отмечена отдельно от независимой проверки.':b.dataset.grade==='again'?'Вернёмся к слову раньше.':wasHinted?'Ответ с подсказкой отмечен отдельно.':'Самостоятельный ответ отмечен. Проверим позже.';cardIndex=(cardIndex+1)%cards.length;revealed=false;hinted=false;typed=false;render();toast(note+' Это демонстрация, прогресс не сохраняется.');return}switch(b.dataset.action){case'reveal':revealed=true;render();break;case'hint':hinted=true;render();break;case'type':typed=true;render();document.getElementById('typedAnswer')?.focus();break;case'mic':voiceActive=!voiceActive;render();break;case'feedback':voiceActive=false;voiceFeedback=true;render();document.querySelector('.conversation-result').scrollIntoView({block:'nearest'});break;case'retry':voiceFeedback=false;voiceActive=false;render();toast('Новая попытка в макете. ИИ не подключён.');break;case'translate':toast('Вы планируете поездку на выходные. Где вы хотели бы остановиться?');break;case'scaffold':toast('Начните с того, куда хотите поехать и какое жильё вам нужно.');break;case'practiceWord':cardIndex=selectedWord;revealed=false;hinted=false;typed=false;go('recall');break}});
document.addEventListener('input',e=>{if(e.target.id==='wordSearch'){query=e.target.value;document.getElementById('wordList').innerHTML=wordList()}});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&active==='recall'&&!revealed&&!e.target.closest('input,textarea,button,a,[contenteditable=true]')){e.preventDefault();revealed=true;render();}});
const params=new URLSearchParams(location.search);if(['paper','signal','fieldnotes'].includes(params.get('theme'))){theme=params.get('theme');document.documentElement.dataset.theme=theme;document.querySelectorAll('[data-theme-button]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.themeButton===theme)))}if(screens.some(x=>x[0]===params.get('screen')))active=params.get('screen');render();
</script>
</body></html>
